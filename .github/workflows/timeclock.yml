name: Timeclock

on:
  # Scheduled punches run from crontab on the runner machine (see
  # scripts/crontab.txt), because GitHub's scheduled runs can be hours late.
  # This workflow is for manual runs.
  workflow_dispatch:
    inputs:
      action:
        description: Action to run
        type: choice
        options: [status, signin, signout, update]
        default: status
      dry-run:
        description: Log in and decide, but do not click
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: timeclock
  cancel-in-progress: false

jobs:
  update:
    if: inputs.action == 'update'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Update the crontab checkout
        shell: bash
        run: git -C "$HOME/nycu-timeclock" pull --ff-only origin main

  punch:
    if: inputs.action != 'update'
    # The timeclock system is only reachable from the campus network.
    runs-on: self-hosted
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Punch
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
          NYCU_USERNAME: ${{ secrets.USERNAME }}
          NYCU_PASSWORD: ${{ secrets.PASSWORD }}
          NYCU_TOTP_SECRET: ${{ secrets.TOTP }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node src/index.js "$ACTION" $DRY_RUN
