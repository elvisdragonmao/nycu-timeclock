name: Timeclock

on:
  schedule:
    # Times are Asia/Taipei (UTC+8), Monday to Friday. Scheduled runs are often
    # delayed, so each run starts early and waits for the exact time itself.
    - cron: "15 23 * * 0-4" # 07:15 → sign in at 08:00
    - cron: "1 4 * * 1-5" # 12:01 → sign out, then sign in at 12:45
    - cron: "1 9 * * 1-5" # 17:01 → sign out
  workflow_dispatch:
    inputs:
      action:
        description: Action to run
        type: choice
        options: [status, signin, signout]
        default: status
      dry-run:
        description: Log in and decide, but do not click
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: timeclock
  cancel-in-progress: false

jobs:
  punch:
    # The timeclock system is only reachable from the campus network.
    runs-on: self-hosted
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Punch
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
          NYCU_USERNAME: ${{ secrets.USERNAME }}
          NYCU_PASSWORD: ${{ secrets.PASSWORD }}
          NYCU_TOTP_SECRET: ${{ secrets.TOTP }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          case "$SCHEDULE" in
            "15 23 * * 0-4") node src/index.js signin --not-before 08:00 ;;
            "1 4 * * 1-5")
              node src/index.js signout; out=$?
              node src/index.js signin --not-before 12:45; in=$?
              exit $((out || in)) ;;
            "1 9 * * 1-5") node src/index.js signout ;;
            "") node src/index.js "$ACTION" $DRY_RUN ;;
            *) echo "Unknown schedule: $SCHEDULE"; exit 1 ;;
          esac
